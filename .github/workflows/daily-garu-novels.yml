name: Ollama Daily Garu Novel

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD). Empty = today in JST."
        required: false
        type: string
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: ollama-daily-garu-novel
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target date
        id: date
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ollama failed to start"
          cat /tmp/ollama.log
          exit 1

      - name: Pull model
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.5:4b' }}
        run: ollama pull "$OLLAMA_MODEL"

      - name: Generate new episodes with Ollama
        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.5:4b' }}
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          TARGET_LANGS: ${{ vars.OLLAMA_TARGET_LANGS || 'ja,en,zh,fr,id,it,ne' }}
        run: node scripts/generate-daily-novels.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain -- src/data/novels.json src/data/chapters)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_DATE="${{ steps.date.outputs.target_date }}"
          TARGET_LANGS="${{ vars.OLLAMA_TARGET_LANGS || 'ja,en,zh,fr,id,it,ne' }}"
          git add src/data/novels.json src/data/chapters
          git commit -m "chore(ollama): generate daily Garu chapters (${TARGET_LANGS}) for ${TARGET_DATE}"
          git push
