<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0807" />
    <meta name="robots" content="noindex" />
    <title>Garoop Novel</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        padding: 24px; box-sizing: border-box; text-align: center;
        background: linear-gradient(135deg, #07080c 0%, #0f111a 50%, #0b0d14 100%);
        color: #f1f5f9;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
      }
      .icon { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 0 0 1px rgba(253, 230, 138, 0.15); }
      h1 { font-size: 1.25rem; margin: 0; font-family: "Noto Serif JP", serif; }
      p { margin: 0; line-height: 1.8; color: #94a3b8; }
      button {
        margin-top: 8px; padding: 10px 24px; border-radius: 9999px;
        border: 1px solid rgba(253, 230, 138, 0.35); background: rgba(28, 25, 23, 0.6);
        color: #fde68a; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <picture>
      <source srcset="/icon-192.webp" type="image/webp" />
      <img class="icon" src="/icon-192.png" alt="Garoop Novel" width="192" height="192" />
    </picture>
    <h1>インターネットにつながっていません</h1>
    <p>
      通信できる場所で、もういちど開いてください。<br />
      You are offline. Please try again when you are connected.
    </p>
    <button type="button" onclick="location.reload()">もういちど読み込む</button>
  </body>
</html>
